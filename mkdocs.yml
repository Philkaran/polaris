site_name: Project Polaris
site_url: https://infra.vestlux.com
repo_url: https://github.com/Philkaran/polaris
theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: cyan
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Architecture Decisions:
      - Overview: adr/index.md
      - "ADR 0001: Site Structure and Platform Choice": adr/0001-site-structure-and-platform-choice.md
  - Runbooks:
      - Overview: runbooks/index.md
      - "Intermittent connectivity on wireless client devices": runbooks/wireless-client-intermittent-connectivity.md
  - Exam Tracker:
      - "AZ-104 objectives": exam-tracker/az-104.md
  - Weekly Log:
      - Overview: weekly-log/index.md
      - "Day 0: Site Build and Infrastructure Platform": weekly-log/day-0.md

      - "Day 1: Azure Fundamentals": weekly-log/day-01.md
      - "Day 2: Identity and Access": weekly-log/day-02.md
      - "Day 3: Governance": weekly-log/day-03.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
